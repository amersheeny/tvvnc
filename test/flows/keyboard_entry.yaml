appId: com.asheeny.tvvnc
---
# Existing harmless controller profile; no app-data clearing or real-TV writes.
- launchApp
- tapOn: ${TV_PATTERN}
- assertVisible: 'Power'
- tapOn: 'Keyboard'
- assertVisible: 'Leave Keyboard'
- assertVisible: 'Hide text'
- assertNotVisible: 'Compose'
- assertNotVisible: 'Live edit'
- takeScreenshot: keyboard-ime-on-entry
- inputText: 'Keyboard UI fixture'
- assertVisible: 'Keyboard UI fixture'
- takeScreenshot: keyboard-typed
- tapOn: 'Leave Keyboard'
- assertVisible: 'Power'
- takeScreenshot: keyboard-closed-to-remote
- tapOn: 'Keyboard'
- assertVisible: 'Keyboard UI fixture'
- takeScreenshot: keyboard-reopened
- back
- assertVisible: 'Hide text'
- takeScreenshot: keyboard-ime-dismissed
- back
- assertVisible: 'Power'
- takeScreenshot: keyboard-back-to-remote
