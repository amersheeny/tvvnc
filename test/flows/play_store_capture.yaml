appId: com.asheeny.tvvnc
---
- tapOn: "Open navigation menu"
- tapOn: "(?s)Remote.*"
- extendedWaitUntil:
    visible: "(?s).*Connected.*On"
    timeout: 20000
- tapOn: "Show menu"
- tapOn: "Edit"
- longPressOn: "TV name"
- tapOn: "Select all"
- eraseText: 1
- inputText: "Demo TV"
- hideKeyboard
- tapOn: "Save"
- assertVisible: "Demo TV"
- extendedWaitUntil:
    visible: "Live TV screen"
    timeout: 20000
- assertVisible: "Power"
- takeScreenshot: remote
- tapOn: "Show menu"
- takeScreenshot: remote-menu
- back
