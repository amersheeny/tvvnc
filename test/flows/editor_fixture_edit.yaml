appId: com.asheeny.tvvnc
---
- tapOn: "Pairing code"
- inputText: "${PAIRING_CODE}"
- tapOn: "Pair"
- extendedWaitUntil:
    visible: "(?s).*Android TV Remote.*Connected.*"
    timeout: 20000
- tapOn: "Keyboard"
- assertVisible: "Example search"
- takeScreenshot: native-prefill
- inputText: " now"
- assertVisible: "Example search now"
- takeScreenshot: native-edit
- eraseText: 1
- assertVisible: "Example search no"
- takeScreenshot: native-delete
- pressKey: Enter
- takeScreenshot: native-submit
